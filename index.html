<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Money Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .tracker-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 { text-align: center; color: #2c3e50; }
    .balance-box {
      background: #27ae60;
      color: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .balance-box h3 { margin: 0; font-size: 24px; }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      background-color: #2980b9;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #1f6391; }
    .clear-btn {
      background-color: #e74c3c;
      margin-top: 10px;
      width: 100%;
    }
    .clear-btn:hover { background-color: #c0392b; }
    ul { list-style: none; padding: 0; }
    li {
      background: #ecf0f1;
      margin-bottom: 8px;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover { background-color: #c0392b; }
  </style>
</head>
<body>

  <div class="tracker-card">
    <h2>Money Saver Tracker</h2>

    <div class="input-group" style="margin-bottom: 15px;">
      <label for="budget-input"><strong>Total Budget Set Pannunga:</strong></label>
      <input type="number" id="budget-input" placeholder="e.g., 5000" oninput="updateBudget()">
    </div>
    
    <div class="balance-box">
      <p>Meedi Balance Amount</p>
      <h3 id="total-balance">₹0</h3>
    </div>

    <div class="input-group">
      <input type="text" id="expense-title" placeholder="Selavu Edhuku? (e.g., Food)">
      <input type="number" id="expense-amount" placeholder="Evlo Amount? (e.g., 150)">
      <button onclick="addExpense()">Add Expense</button>
    </div>

    <h3>Selavu List:</h3>
    <ul id="expense-list"></ul>
    <button class="clear-btn" onclick="clearAll()">Clear All Expenses</button>
  </div>

  <script>
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
    let totalBudget = Number(localStorage.getItem('totalBudget')) || 5000;

    document.getElementById('budget-input').value = totalBudget;

    function updateBudget() {
      const budgetInput = document.getElementById('budget-input').value;
      totalBudget = Number(budgetInput) || 0;
      localStorage.setItem('totalBudget', totalBudget);
      updateUI();
    }

    function updateUI() {
      const list = document.getElementById('expense-list');
      const totalBalanceEl = document.getElementById('total-balance');
      
      list.innerHTML = '';
      let totalSpent = 0;

      expenses.forEach((item, index) => {
        totalSpent += Number(item.amount);
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item.title} - <strong>₹${item.amount}</strong></span>
          <button class="delete-btn" onclick="deleteExpense(${index})">Delete</button>
        `;
        list.appendChild(li);
      });

      const remainingBalance = totalBudget - totalSpent;
      totalBalanceEl.innerText = `₹${remainingBalance}`;
      
      localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    function addExpense() {
      const titleInput = document.getElementById('expense-title');
      const amountInput = document.getElementById('expense-amount');

      const title = titleInput.value.trim();
      const amount = Number(amountInput.value);

      if (title === '' || amount <= 0 || isNaN(amount)) {
        alert('Dhayavu seidhu sariyaana details-aiyum amount-aiyum type pannunga!');
        return;
      }

      expenses.push({ title, amount });
      updateUI();

      titleInput.value = '';
      amountInput.value = '';
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      updateUI();
    }

    function clearAll() {
      if (confirm('Ella expenses-yum delete panna poringala?')) {
        expenses = [];
        updateUI();
      }
    }

    updateUI();
  </script>

</body>
</html>
